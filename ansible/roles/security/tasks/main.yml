---
- name: Installer UFW, fail2ban et unattended-upgrades
  ansible.builtin.apt:
    name:
      - ufw
      - fail2ban
      - unattended-upgrades
    state: present

- name: Politique UFW par défaut, tout refuser en entrée
  community.general.ufw:
    default: deny
    direction: incoming

- name: Politique UFW par défaut, tout autoriser en sortie
  community.general.ufw:
    default: allow
    direction: outgoing

- name: Autoriser les ports nécessaires
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ security_allowed_tcp_ports }}"

- name: Activer UFW
  community.general.ufw:
    state: enabled

- name: Durcir SSH (pas de root, pas de mot de passe)
  ansible.builtin.copy:
    dest: /etc/ssh/sshd_config.d/99-hardening.conf
    content: |
      PermitRootLogin no
      PasswordAuthentication no
      PubkeyAuthentication yes
      X11Forwarding no
      MaxAuthTries 3
    mode: "0644"
    validate: "/usr/sbin/sshd -t -f %s"
  notify: Redémarrer ssh

- name: Activer fail2ban
  ansible.builtin.service:
    name: fail2ban
    state: started
    enabled: true

- name: Activer les mises à jour de sécurité automatiques
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    mode: "0644"