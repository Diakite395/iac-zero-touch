---
- name: Installer Nginx
  ansible.builtin.apt:
    name: nginx
    state: present

- name: Déployer la page d'accueil
  ansible.builtin.template:
    src: index.html.j2
    dest: "{{ nginx_web_root }}/index.html"
    owner: www-data
    group: www-data
    mode: "0644"

- name: Déployer la configuration du site
  ansible.builtin.template:
    src: default.conf.j2
    dest: /etc/nginx/sites-available/default
    mode: "0644"
  notify: Recharger nginx

- name: Vérifier la configuration Nginx
  ansible.builtin.command: nginx -t
  changed_when: false

- name: Activer et démarrer Nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true