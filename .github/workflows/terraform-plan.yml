name: Terraform Plan

on:
  pull_request:
    branches: [main]

permissions:
  id-token: write       # nécessaire pour OIDC
  contents: read
  pull-requests: write  # pour commenter la PR

env:
  TF_IN_AUTOMATION: "true"
  TF_VAR_admin_cidr: ${{ secrets.ADMIN_CIDR }}
  TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform

    steps:
      - uses: actions/checkout@v4

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: eu-west-3

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.17.0"   # METS ICI ta version locale (terraform -version)
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate

      - name: Plan
        run: terraform plan -input=false -no-color -out=tfplan

      - name: Render plan
        run: terraform show -no-color tfplan > plan.txt

      - name: Comment on PR
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const fence = String.fromCharCode(96).repeat(3);
            let plan = fs.readFileSync('terraform/plan.txt', 'utf8');
            if (plan.length > 60000) plan = plan.slice(0, 60000) + '\n... (tronqué)';
            const body = '### Terraform Plan\n' + fence + '\n' + plan + '\n' + fence;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });